name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t myapp:latest .

      # 5️⃣ Run tests inside container
      - name: Run tests
        run: |
          docker run --rm myapp:latest pytest || echo "No tests found"

      # 6️⃣ Tag & Push image to Docker Hub
      - name: Push Docker image
        run: |
          IMAGE_NAME=mydockerhubuser/myapp
          docker tag myapp:latest $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:${{ github.sha }}
          docker tag myapp:latest $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

      # 7️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      # 8️⃣ Deploy to Kubernetes (EKS, Minikube, GKE, etc.)
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 9️⃣ Post-deployment health check
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/myapp-deployment
          kubectl get pods -o wide
